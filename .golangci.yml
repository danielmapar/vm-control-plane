version: "2"

linters:
  default: standard
  enable:
    - misspell
    - unconvert
    - unparam
    - copyloopvar
  settings:
    errcheck:
      exclude-functions:
        # Rendering writes to tabwriter/stdout: errors are surfaced by Flush
        # or are unactionable at print sites.
        - fmt.Fprintf
        - fmt.Fprintln
        - fmt.Fprint
  exclusions:
    generated: lax
    paths:
      - proto

formatters:
  enable:
    - gofmt
    - goimports
