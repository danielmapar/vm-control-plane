version: v2
modules:
  - path: proto
lint:
  use:
    - STANDARD
  except:
    # Long-running-operation pattern (AIP-151): mutating RPCs return the
    # shared Operation message directly, like google.longrunning.Operation.
    - RPC_REQUEST_RESPONSE_UNIQUE
    - RPC_RESPONSE_STANDARD_NAME
breaking:
  use:
    - FILE
