name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.12.2

  proto:
    # buf lint + regeneration clean-diff: stale generated Go or breaking
    # proto edits fail here, not in a reviewer's head (PR 4-8 triage).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make tools
      - run: |
          export PATH="$PATH:$(go env GOPATH)/bin"
          buf lint
          buf generate
          git diff --exit-code -- proto

  build-both-goos:
    # Cross-compile gate: one stray netlink/x-sys import must fail CI, not a
    # developer machine. Cross-compiling is NOT testing — the test matrix
    # below runs natively on both OSes.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: GOOS=linux go build ./...
      - run: GOOS=windows go build ./...

  test:
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./...

  race:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test -race ./...

  stress:
    # Bounded repeat runs to surface flaky concurrency early; scope grows
    # with the hot packages (claims, grants, sessions, scheduler, executor).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test -race -count=3 -timeout=15m ./internal/...
