name: Publish learning site

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/learning-site.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: learning-site
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Stage the static site
        run: |
          mkdir -p _site
          cp -r docs/. _site/
          touch _site/.nojekyll
          test -f _site/index.html
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
