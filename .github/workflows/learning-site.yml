name: Publish learning site

on:
  push:
    branches: [main]
    paths:
      - 'docs/tutorial/learn-virtualization/**'
      - '.github/workflows/learning-site.yml'
  pull_request:
    paths:
      - 'docs/tutorial/learn-virtualization/**'
      - '.github/workflows/learning-site.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: learning-site-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: docs/tutorial/learn-virtualization/requirements.txt
      - name: Install renderer
        run: python -m pip install -r docs/tutorial/learn-virtualization/requirements.txt
      - name: Build and check
        run: |
          python docs/tutorial/learn-virtualization/build.py --output _site/tutorial/learn-virtualization
          python docs/tutorial/learn-virtualization/check.py _site/tutorial/learn-virtualization
          cp docs/tutorial/learn-virtualization/pages-index.html _site/index.html
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          path: _site

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
