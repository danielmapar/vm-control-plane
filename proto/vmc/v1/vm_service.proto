syntax = "proto3";

package vmc.v1;

import "vmc/v1/operation.proto";
import "vmc/v1/vm.proto";

// VMService is the public API. Every mutating RPC carries an idempotency
// key minted by the CLIENT before its first attempt: a timeout-and-retry
// replays the same key, and the server's idempotency envelope (keyed on it,
// storing method + canonical request hash) is the serialization point —
// same key + same request returns the original operation; same key +
// different request is FAILED_PRECONDITION (plan D3).
service VMService {
  rpc CreateVm(CreateVmRequest) returns (Operation);
  // UpdateVmPower is the ONLY mutable-spec verb in v0.1 (plan D3): it bumps
  // spec_generation and desired_revision under a resource_version
  // precondition; everything else about a VM is immutable after create.
  rpc UpdateVmPower(UpdateVmPowerRequest) returns (Operation);
  rpc DeleteVm(DeleteVmRequest) returns (Operation);
  rpc GetVm(GetVmRequest) returns (VirtualMachine);
  rpc ListVms(ListVmsRequest) returns (ListVmsResponse);
}

message UpdateVmPowerRequest {
  string idempotency_key = 1;
  string name = 2;
  PowerState power = 3;
  // Optional optimistic-concurrency precondition: when non-zero, the update
  // applies only if the row's resource_version still matches.
  int64 expected_resource_version = 4;
}

message CreateVmRequest {
  // Client-minted UUID; the idempotency envelope key.
  string idempotency_key = 1;
  string name = 2;
  VmSpec spec = 3;
}

message DeleteVmRequest {
  string idempotency_key = 1;
  string name = 2;
}

message GetVmRequest {
  string name = 1;
}

message ListVmsRequest {
  // Page size 0 means server default.
  int32 page_size = 1;
  string page_token = 2;
}

message ListVmsResponse {
  repeated VirtualMachine vms = 1;
  string next_page_token = 2;
}
