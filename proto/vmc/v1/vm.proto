syntax = "proto3";

package vmc.v1;

import "google/protobuf/timestamp.proto";

// VirtualMachine is the core resource: a spec the user owns, a status the
// reconciler owns, and the revision vocabulary that fences every writer
// (implementation plan §6).
message VirtualMachine {
  ResourceMeta meta = 1;
  VmSpec spec = 2;
  VmStatus status = 3;
}

// ResourceMeta is shared by all resources.
message ResourceMeta {
  // Server-assigned UUID, stable for the resource's lifetime.
  string id = 1;
  // Unique human name (DNS-label constrained).
  string name = 2;
  // Bumped on every user-visible spec change. In v0.1 only the desired
  // power state is mutable.
  int64 spec_generation = 3;
  // Optimistic-lock version: bumped on EVERY row write by any writer.
  int64 resource_version = 4;
  // Monotonic desired revision: spec generations plus the deletion
  // tombstone. Agents never act on an older revision than one they have
  // already seen for the VM.
  int64 desired_revision = 5;
  google.protobuf.Timestamp create_time = 6;
  google.protobuf.Timestamp update_time = 7;
  // Set when the resource is tombstoned; the row outlives the substrate
  // resources it drives (deletion is reconciliation too).
  google.protobuf.Timestamp delete_time = 8;
}

message VmSpec {
  // Number of virtual CPUs. Immutable after create.
  uint32 cpus = 1;
  // Guest memory in bytes. Immutable after create.
  uint64 memory_bytes = 2;
  // Backing image reference (e.g. "ubuntu-24.04"). Immutable after create.
  string image = 3;
  // Root disk virtual size in bytes; must be >= the backing image's
  // virtual size. Immutable after create.
  uint64 root_disk_bytes = 4;
  // Optional tenant network name; empty means management NIC only.
  // Immutable after create.
  string network = 5;
  // The only mutable field in v0.1 (vmctl start/stop).
  PowerState power = 6;
  // Scheduling constraints: every key=value must match node labels.
  map<string, string> constraints = 7;
  map<string, string> labels = 8;
}

enum PowerState {
  POWER_STATE_UNSPECIFIED = 0;
  POWER_STATE_RUNNING = 1;
  POWER_STATE_STOPPED = 2;
}

message VmStatus {
  Phase phase = 1;
  // Logical node this VM is placed on (empty until scheduled).
  string node = 2;
  // Fencing token: bumped on every (re)assignment. Stamped on every
  // substrate artifact this VM owns.
  int64 placement_epoch = 3;
  // The desired revision the agent most recently realized, from
  // evidence-bearing reports — never inferred from the desired row.
  int64 applied_revision = 4;
  // Management-NIC address discovered from the DHCP lease.
  string mgmt_ip = 5;
  // Last terminal error (phase FAILED).
  string last_error = 6;
  repeated Condition conditions = 7;
}

enum Phase {
  PHASE_UNSPECIFIED = 0;
  PHASE_PENDING = 1;
  PHASE_SCHEDULING = 2;
  PHASE_PROVISIONING = 3;
  PHASE_RUNNING = 4;
  PHASE_STOPPED = 5;
  // Node lost after the placement was exposed (execution grant committed):
  // never rescheduled automatically — two VMs is worse than one late VM.
  PHASE_UNKNOWN = 6;
  // Durable retry budget exhausted or permanent error; the matching
  // operation is terminalized in the same transaction.
  PHASE_FAILED = 7;
  PHASE_DELETING = 8;
}

// Condition surfaces non-phase state (Unschedulable, RestartRequired, …).
message Condition {
  string type = 1;
  bool active = 2;
  string reason = 3;
  string message = 4;
  int64 observed_revision = 5;
  google.protobuf.Timestamp update_time = 6;
}
