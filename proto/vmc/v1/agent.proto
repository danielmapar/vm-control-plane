syntax = "proto3";

package vmc.v1;

import "google/protobuf/duration.proto";
import "vmc/v1/vm.proto";

// AgentService is the daemon-facing surface (served by the control plane;
// the daemon PULLS — the control plane never dials into hosts, ADR-0004).
//
// Safety order for a placement: PollIntents shows work; RequestGrant makes
// exposure durable; only a committed grant permits substrate actions;
// Report carries ordered evidence; TeardownReceipt is the separate message
// type allowed to prove old-epoch cleanup.
service AgentService {
  rpc RegisterHost(RegisterHostRequest) returns (RegisterHostResponse);
  rpc Heartbeat(HeartbeatRequest) returns (HeartbeatResponse);
  rpc PollIntents(PollIntentsRequest) returns (PollIntentsResponse);
  rpc RequestGrant(RequestGrantRequest) returns (RequestGrantResponse);
  rpc Report(ReportRequest) returns (ReportResponse);
  rpc TeardownReceipt(TeardownReceiptRequest) returns (TeardownReceiptResponse);
  // ActionFailed records a failed substrate attempt so retry pacing stays
  // durable server-side (an agent restart cannot reset backoff — plan D5).
  rpc ActionFailed(ActionFailedRequest) returns (ActionFailedResponse);
}

message ActionFailedRequest {
  NodeSession session = 1;
  string vm_id = 2;
  int64 placement_epoch = 3;
  int64 desired_revision = 4;
  string attempt_token = 5;
  string error = 6;
  string error_class = 7;
}

message ActionFailedResponse {}

message NodeSession {
  string node_name = 1;
  string session_id = 2;
  int64 session_generation = 3;
}

message RegisterHostRequest {
  string host_id = 1;
  int64 cpus = 2;
  uint64 memory_bytes = 3;
  uint64 disk_bytes = 4;
  repeated NodeQuota nodes = 5;
  google.protobuf.Duration lease = 6;
}

message NodeQuota {
  string name = 1;
  int64 cpus = 2;
  uint64 memory_bytes = 3;
  uint64 disk_bytes = 4;
  map<string, string> labels = 5;
}

message RegisterHostResponse {
  repeated NodeSession sessions = 1;
}

message HeartbeatRequest {
  NodeSession session = 1;
  google.protobuf.Duration lease = 2;
}

message HeartbeatResponse {}

message PollIntentsRequest {
  repeated NodeSession sessions = 1;
}

// PollIntentsResponse is an authoritative snapshot: `complete` is the
// explicit completeness marker — local GC decisions are legal only against
// complete snapshots (plan §6.4).
message PollIntentsResponse {
  string snapshot_token = 1;
  bool complete = 2;
  repeated Intent intents = 3;
}

// Intent is the desired state of one VM for one placement epoch. The
// daemon never acts on a revision older than one it has seen, and never
// acts at all before its grant commits.
message Intent {
  string vm_id = 1;
  string vm_name = 2;
  string node_name = 3;
  int64 placement_epoch = 4;
  int64 desired_revision = 5;
  // Tombstone intent: drive teardown, then send TeardownReceipt.
  bool deleted = 6;
  VmSpec spec = 7;
  // Server-controlled retry pacing: do not attempt before this many
  // milliseconds from now (durable action-retry state lives server-side).
  int64 not_before_ms = 8;
  // Attempt token for idempotent result acceptance.
  string attempt_token = 9;
}

message RequestGrantRequest {
  NodeSession session = 1;
  string vm_id = 2;
  int64 placement_epoch = 3;
}

message RequestGrantResponse {
  bool granted = 1;
  // Denial reason (admission predicate that failed) when granted=false.
  string reason = 2;
}

// ReportRequest carries ordered evidence: (session_generation, report_seq)
// compared lexicographically per VM — a restarted daemon's fresh session
// starts at seq 1 without being rejected behind the old session's high
// sequence, while delayed old-session reports ARE rejected.
message ReportRequest {
  NodeSession session = 1;
  string vm_id = 2;
  int64 placement_epoch = 3;
  int64 report_seq = 4;
  // The desired revision this report is evidence FOR (never inferred).
  int64 applied_revision = 5;
  ObservedState state = 6;
  string detail = 7;
}

enum ObservedState {
  OBSERVED_STATE_UNSPECIFIED = 0;
  OBSERVED_STATE_RUNNING = 1;
  OBSERVED_STATE_SHUTOFF = 2;
  OBSERVED_STATE_ABSENT = 3;
}

message ReportResponse {}

message TeardownReceiptRequest {
  NodeSession session = 1;
  string vm_id = 2;
  int64 placement_epoch = 3;
  string attempt_token = 4;
}

message TeardownReceiptResponse {}
