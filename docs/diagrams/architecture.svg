<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="700" viewBox="0 0 1240 700" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1240" height="700" rx="8" fill="#ffffff"/>

  <!-- ══════════ vmctl ══════════ -->
  <rect x="40" y="50" width="180" height="60" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="130" y="76" text-anchor="middle" font-size="14" font-weight="600" fill="#1e293b">vmctl</text>
  <text x="130" y="94" text-anchor="middle" font-size="11" fill="#64748b">operator CLI (gRPC)</text>

  <!-- ══════════ control-plane ══════════ -->
  <rect x="40" y="200" width="400" height="300" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="60" y="224" font-size="14" font-weight="700" fill="#1e293b">control-plane</text>

  <rect x="70" y="234" width="340" height="52" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.2"/>
  <text x="240" y="256" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1e293b">gRPC API — VM · Volume · Network · Node · Operation</text>
  <text x="240" y="274" text-anchor="middle" font-size="10" fill="#64748b">validates · persists desired state · returns async Operation</text>

  <rect x="70" y="306" width="340" height="52" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.2"/>
  <text x="240" y="328" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1e293b">reconciler — level-triggered work queue</text>
  <text x="240" y="346" text-anchor="middle" font-size="10" fill="#64748b">durable lease claims · CAS completion · retry budget · resync</text>

  <rect x="70" y="378" width="340" height="52" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.2"/>
  <text x="240" y="400" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1e293b">scheduler — filter (capacity · labels) → score</text>
  <text x="240" y="418" text-anchor="middle" font-size="10" fill="#64748b">transactional node assignment + capacity reservation</text>

  <!-- ══════════ PostgreSQL cylinder ══════════ -->
  <path d="M120,560 v80 a120,16 0 0 0 240,0 v-80" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
  <ellipse cx="240" cy="560" rx="120" ry="16" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
  <text x="240" y="596" text-anchor="middle" font-size="13" font-weight="700" fill="#1e293b">PostgreSQL</text>
  <text x="240" y="614" text-anchor="middle" font-size="9.5" fill="#64748b">desired + observed state · generations</text>
  <text x="240" y="628" text-anchor="middle" font-size="9.5" fill="#64748b">operations · idempotency keys · nodes · events</text>

  <!-- ══════════ node-a ══════════ -->
  <rect x="640" y="140" width="560" height="430" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="660" y="166" font-size="14" font-weight="700" fill="#1e293b">virtualization host — one hypervisor-agent per host</text>

  <rect x="670" y="180" width="500" height="140" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.2"/>
  <text x="690" y="202" font-size="12.5" font-weight="600" fill="#1e293b">hypervisor-agent</text>
  <text x="690" y="218" font-size="10" fill="#64748b">host lock + host_id · logical nodes a/b · grants before actions · per-VM executors</text>

  <rect x="690" y="240" width="140" height="60" rx="8" fill="#f8fafc" stroke="#86efac" stroke-width="1.2"/>
  <text x="760" y="262" text-anchor="middle" font-size="11" font-weight="600" fill="#1e293b">volume driver</text>
  <text x="760" y="280" text-anchor="middle" font-size="9.5" fill="#64748b">qemu-img · qcow2</text>

  <rect x="860" y="240" width="140" height="60" rx="8" fill="#f8fafc" stroke="#86efac" stroke-width="1.2"/>
  <text x="930" y="262" text-anchor="middle" font-size="11" font-weight="600" fill="#1e293b">network driver</text>
  <text x="930" y="280" text-anchor="middle" font-size="9.5" fill="#64748b">libovsdb → OVS</text>

  <rect x="1010" y="240" width="140" height="60" rx="8" fill="#f8fafc" stroke="#86efac" stroke-width="1.2"/>
  <text x="1080" y="262" text-anchor="middle" font-size="11" font-weight="600" fill="#1e293b">compute driver</text>
  <text x="1080" y="280" text-anchor="middle" font-size="9.5" fill="#64748b">go-libvirt RPC</text>

  <!-- substrate -->
  <rect x="670" y="400" width="150" height="120" rx="8" fill="#fafaf9" stroke="#a8a29e" stroke-width="1.2"/>
  <text x="745" y="430" text-anchor="middle" font-size="11" font-weight="600" fill="#1e293b">qcow2 volume</text>
  <text x="745" y="448" text-anchor="middle" font-size="9.5" fill="#64748b">workspace.qcow2</text>
  <text x="745" y="464" text-anchor="middle" font-size="9.5" fill="#64748b">backing: ubuntu-24.04</text>
  <text x="745" y="480" text-anchor="middle" font-size="9.5" fill="#64748b">offline snapshots</text>

  <rect x="845" y="400" width="150" height="120" rx="8" fill="#fafaf9" stroke="#a8a29e" stroke-width="1.2"/>
  <text x="920" y="430" text-anchor="middle" font-size="11" font-weight="600" fill="#1e293b">Open vSwitch</text>
  <text x="920" y="448" text-anchor="middle" font-size="9.5" fill="#64748b">vmc-int bridge · VLAN per network</text>
  <text x="920" y="464" text-anchor="middle" font-size="9.5" fill="#64748b">tagged port added by libvirt</text>
  <text x="920" y="480" text-anchor="middle" font-size="9.5" fill="#64748b">at domain start</text>

  <rect x="1020" y="400" width="150" height="120" rx="8" fill="#fafaf9" stroke="#a8a29e" stroke-width="1.2"/>
  <text x="1095" y="430" text-anchor="middle" font-size="10.5" font-weight="600" fill="#1e293b">libvirtd → KVM/QEMU</text>
  <text x="1095" y="448" text-anchor="middle" font-size="9.5" fill="#64748b">domain: web-1 · owner tag</text>
  <text x="1095" y="464" text-anchor="middle" font-size="9.5" fill="#64748b">mgmt NIC (NAT) + tenant NIC</text>
  <text x="1095" y="480" text-anchor="middle" font-size="9.5" fill="#64748b">cloud-init NoCloud seed</text>

  <!-- ══════════ node-b (ghost) ══════════ -->
  <rect x="640" y="595" width="560" height="70" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.2" stroke-dasharray="6 4" opacity="0.75"/>
  <text x="920" y="622" text-anchor="middle" font-size="10.5" font-weight="600" fill="#334155">logical nodes a + b — scheduling partitions served by the same host daemon</text>
  <text x="920" y="640" text-anchor="middle" font-size="9.5" fill="#64748b">scheduler places VMs across them by capacity, labels, spread; sessions bind to host_id</text>

  <!-- ══════════ flow arrows ══════════ -->
  <!-- 1: vmctl -> api -->
  <line x1="130" y1="110" x2="130" y2="231" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>
  <!-- 2: api -> PG (left lane) -->
  <path d="M70,260 H52 V600 H117" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>
  <!-- 3: PG -> reconciler (right lane) -->
  <path d="M360,585 H470 V332 H413" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>
  <!-- 4: scheduler <-> PG -->
  <line x1="280" y1="430" x2="280" y2="541" stroke="#475569" stroke-width="1.6" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <!-- 10: reconciler status write -> PG -->
  <line x1="180" y1="500" x2="180" y2="541" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>
  <!-- 5: control-plane -> agent (intents) -->
  <path d="M440,270 H550 V210 H666" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="553" y="196" text-anchor="middle" font-size="9.5" fill="#64748b">intents (revision + epoch)</text>
  <!-- 9: agent -> control-plane (observed) -->
  <path d="M670,300 H510 V356 H444" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="600" y="292" text-anchor="middle" font-size="9.5" fill="#64748b">observed state</text>
  <!-- 6,7,8: drivers -> substrate -->
  <line x1="750" y1="300" x2="748" y2="397" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="925" y1="300" x2="922" y2="397" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="1088" y1="300" x2="1091" y2="397" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- ══════════ step badges ══════════ -->
  <g font-size="11" font-weight="700" text-anchor="middle">
    <circle cx="152" cy="170" r="11" fill="#0f172a"/><text x="152" y="174" fill="#ffffff">1</text>
    <circle cx="52"  cy="330" r="11" fill="#0f172a"/><text x="52"  y="334" fill="#ffffff">2</text>
    <circle cx="470" cy="460" r="11" fill="#0f172a"/><text x="470" y="464" fill="#ffffff">3</text>
    <circle cx="302" cy="488" r="11" fill="#0f172a"/><text x="302" y="492" fill="#ffffff">4</text>
    <circle cx="550" cy="243" r="11" fill="#0f172a"/><text x="550" y="247" fill="#ffffff">5</text>
    <circle cx="770" cy="350" r="11" fill="#0f172a"/><text x="770" y="354" fill="#ffffff">6</text>
    <circle cx="945" cy="350" r="11" fill="#0f172a"/><text x="945" y="354" fill="#ffffff">7</text>
    <circle cx="1108" cy="350" r="11" fill="#0f172a"/><text x="1108" y="354" fill="#ffffff">8</text>
    <circle cx="510" cy="330" r="11" fill="#0f172a"/><text x="510" y="334" fill="#ffffff">9</text>
    <circle cx="158" cy="522" r="11" fill="#0f172a"/><text x="158" y="526" fill="#ffffff">10</text>
  </g>

  <!-- footer notes -->
  <text x="40" y="662" font-size="10.5" fill="#64748b">All components: slog JSON logs · /metrics (Prometheus) · OpenTelemetry traces — one CreateVM request = one distributed trace.</text>
  <text x="40" y="680" font-size="10.5" fill="#64748b">Numbered steps follow a single CreateVM request; the walkthrough below the diagram explains each step.</text>
</svg>
